mmersive span{font-size:9px;opacity:.5;margin-left:12px}.loading{position:absolute;inset:0;z-index:10;background:#192121;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s;pointer-events:none}.loading-tree{font-size:47px;color:var(--gold)}.loading p{font-family:"Songti SC",serif;font-size:21px;letter-spacing:3px}.loading>span:last-child{font-size:11px;letter-spacing:2px;color:#9da79c}.loading.loaded{opacity:0}.fatal-error{position:absolute;inset:0;z-index:20;background:#1c2525ef;padding:15vh 10%;text-align:center}.fatal-error h2{font-family:serif;font-weight:400}.fatal-error p{font-size:13px;line-height:2;color:#babfb3}.fatal-error button{padding:12px 22px;background:#cbb084;color:#252a26;border-radius:4px}[hidden]{display:none!important}

@media(max-width:1050px){.topbar{padding:0 28px;height:88px}.ambience-panel{right:28px;top:112px;width:237px;padding:22px 19px 0}.panel-heading h2{font-size:18px;margin-bottom:20px}.panel-foot{margin:0 -19px;padding:12px 19px}.control-section{padding:15px 0}.light-section{gap:18px}.scene-caption{left:30px;bottom:130px}.scene-caption h1{font-size:31px;letter-spacing:4px}.bottom-bar{left:28px;right:28px;bottom:24px}.navigation-hint{min-width:0}.navigation-hint>span{max-width:80px;line-height:1.9}.hint-dot{display:none}.view-picker button{width:106px}.live-label{display:none}}
@media(max-height:780px) and (min-width:701px){.ambience-panel{top:98px}.panel-heading h2{margin:10px 0 17px}.control-section{padding:13px 0}.light-section{gap:16px}.panel-foot{padding-top:11px;padding-bottom:11px}.scene-caption{bottom:116px}.topbar{height:86px}.bottom-bar{bottom:23px}}
@media(max-width:700px){#shelter{min-height:480px}.topbar{height:75px;padding:0 20px}.brand>svg{width:21px;height:27px}.brand{gap:9px}.brand>span{font-size:18px;letter-spacing:3px;gap:10px}.brand em{font-size:9px;letter-spacing:2px}.top-actions{gap:21px}.top-button{width:34px;height:34px;padding:0}.top-button>span{display:none}.icon-button{height:34px;width:34px}.ambience-panel{top:86px;right:20px;width:228px;padding-top:21px}.panel-heading h2{font-size:18px;margin-bottom:18px}.control-section{padding:14px 0}.light-section{gap:18px}.scene-caption{left:23px;bottom:120px}.scene-caption h1{font-size:28px;letter-spacing:3px}.scene-caption p{font-size:9px;letter-spacing:1px}.location-label{font-size:7px;letter-spacing:1.8px}.bottom-bar{left:20px;right:20px;bottom:25px;height:47px}.view-picker{width:100%}.view-picker button{width:33.333%;gap:6px;font-size:10px;height:37px}.navigation-hint{display:none}.immersive-button{position:fixed;right:24px;bottom:93px}.immersive-button span{display:none}.immersive-button svg{height:20px;width:20px}.toast{bottom:87px;font-size:10px;width:max-content;text-align:center}.panel-hidden .ambience-panel{transform:translateY(-10px)}}

<body>
  <main id="shelter">
    <canvas id="scene" aria-label="可拖动环顾的三维森林木屋卧室，床上方是雨滴滑落的倾斜天窗"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <div class="loading" id="loading">
      <span class="loading-tree" aria-hidden="true">♧</span>
      <p>穿过森林，回到温暖。</p>
      <span id="load-detail">正在点亮小屋</span>
    </div>
    <header class="topbar interface">
      <a class="brand" href="#" aria-label="林间 Shelter 首页">
        <svg viewBox="0 0 32 36" aria-hidden="true"><path d="M16 2 6 16h6L3 28h11v6h4v-6h11L20 16h6L16 2Z"/></svg>
        <span>林间 <span class="brand-divider"></span><em>SHELTER</em></span>
      </a>
      <div class="top-actions">
        <span class="live-label"><span></span> 一处属于你的避风港</span>
        <button id="sound-toggle" class="top-button" type="button" aria-pressed="false" aria-label="开启环境音">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3Zm13 0 5 6m0-6-5 6" id="sound-path"/></svg>
          <span id="sound-label">开启声音</span>
        </button>
        <button id="panel-toggle" class="icon-button" type="button" aria-label="收起环境设置" aria-expanded="true" aria-controls="ambience-panel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h8m4 0h4M4 17h3m4 0h9M12 4v6M7 14v6"/></svg>
        </button>
      </div>
    </header>
    <aside id="ambience-panel" class="ambience-panel interface" aria-label="环境设置">
      <div class="panel-heading">
        <span class="eyebrow">MAKE YOURSELF AT HOME</span>
        <h2>让世界，慢一点。</h2>
      </div>
      <div class="control-section">
        <div class="control-label"><label for="rain">窗外的雨</label><output id="rain-value" for="rain">绵绵中雨</output></div>
        <input id="rain" aria-label="雨势大小" type="range" min="0" max="100" value="58">
        <div class="range-ends"><span>静谧</span><span>倾盆</span></div>
      </div>
      <div class="control-section time-section">
        <span class="control-label">天色</span>
        <div class="segmented" role="group" aria-label="时间">
          <button type="button" data-time="morning" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 14h16M4 17h12M6 11a4 4 0 0 1 8 0M10 2v2M3 5l2 2m12-2-2 2"/></svg>清晨</button>
          <button type="button" data-time="night" aria-pressed="true"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M15.6 12.6A6.6 6.6 0 0 1 7.4 4.4a6.5 6.5 0 1 0 8.2 8.2Z"/></svg>深夜</button>
        </div>
      </div>
      <div class="control-section light-section">
        <label class="switch-row" for="lamp"><span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m6 3-3 9h14l-3-9H6Zm4 9v5m-4 0h8"/></svg>床头暖灯</span><input id="lamp" type="checkbox" role="switch" checked><i aria-hidden="true"></i></label>
        <label class="switch-row" for="fire"><span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2c1 5 5 5 5 10a5 5 0 0 1-10 0c0-2 1-4 3-5 0 3 2 3 2-5Z"/></svg>壁炉的火</span><input id="fire" type="checkbox" role="switch" checked><i aria-hidden="true"></i></label>
      </div>
      <div class="control-section volume-section">
        <div class="control-label"><label for="volume">环境音量</label><output id="volume-value" for="volume">55%</output></div>
        <input id="volume" aria-label="环境音量" type="range" min="0" max="100" value="55">
        <p class="audio-note" id="audio-note">戴上耳机，让雨声包围你</p>
      </div>
      <div class="panel-foot">
        <span class="glass-symbol" aria-hidden="true">✧</span>
        <p>轻点天窗，拭去一小片雾气<br>碰一碰茶杯，感受升起的暖意</p>
      </div>
    </aside>
    <div class="scene-caption interface">
      <div class="location-label"><span class="small-line"></span> FOREST CABIN · <span id="time-label">23:48</span></div>
      <h1>今夜，只听雨。</h1>
      <p>世界很大。这一刻，小屋刚刚好。</p>
    </div>
    <footer class="bottom-bar interface">
      <div class="navigation-hint"><svg viewBox="0 0 20 24" aria-hidden="true"><rect x="4" y="2" width="12" height="19" rx="6"/><path d="M10 6v4"/></svg><span>拖动环顾 <span class="hint-dot">·</span> 滚轮靠近</span></div>
      <div class="view-picker" role="group" aria-label="选择视角">
        <button type="button" data-view="room" aria-pressed="true"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m3 8 7-5 7 5v9H3V8Zm5 9v-6h4v6"/></svg><span>环顾小屋</span></button>
        <button type="button" data-view="bed" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5v12m14-7v7M3 14h14M3 10h14M5 7h4v3"/></svg><span>躺下听雨</span></button>
        <button type="button" data-view="fire" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2c1 5 5 5 5 10a5 5 0 0 1-10 0c0-2 1-4 3-5 0 3 2 3 2-5Z"/></svg><span>炉边小憩</span></button>
      </div>
      <button id="immersive" class="immersive-button" type="button" aria-label="进入沉浸模式"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7V3h4m6 0h4v4M3 13v4h4m6 0h4v-4"/></svg><span>沉浸模式</span></button>
    </footer>
    <button id="exit-immersive" class="exit-immersive" type="button" hidden>退出沉浸 <span>Esc</span></button>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="interaction-label" class="interaction-label" aria-hidden="true"></div>
    <div id="fatal-error" class="fatal-error" role="alert" hidden><h2>小屋暂时未能点亮</h2><p id="fatal-message"></p><button type="button" onclick="location.reload()">重新进入</button></div>
  </main>
  <script>(()=>{/**
